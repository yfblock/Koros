[package]
name = "korix"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "korix"
path = "src/main.rs"

[dependencies]
kor = { path = "../../kor" }
kor-alloc = { path = "../../base/kor-alloc" }
kor-fs = { path = "../../filesystems/kor-fs" }
kor-ext2 = { path = "../../filesystems/kor-ext2" }
kor-ramfs = { path = "../../filesystems/kor-ramfs" }
kor-arch = { path = "../../base/kor-arch" }
kor-sched = { path = "../../base/kor-sched" }
kor-virtio = { path = "../../base/kor-virtio" }
kor-mmu = { path = "../../base/kor-mmu" }
spin = "0.9"
buddy_system_allocator = "0.11"
smoltcp = { version = "0.12", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp"] }


[build-dependencies]
# build.rs generates linker script from linker.lds template
