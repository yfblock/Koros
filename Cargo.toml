[workspace]
resolver = "2"
# Four tiers:
#   kor/          — foundation crate (traits + registries + frame allocator)
#   base/         — core kernel services (alloc, arch, mmu, sched, virtio)
#   filesystems/  — storage stack (fs infrastructure + concrete filesystems)
#   apps/         — composition roots (koros kernel demo, korix Linux-compat, korhv hypervisor)
members = [
    "kor",
    "base/kor-alloc",
    "base/kor-arch",
    "base/kor-mmu",
    "base/kor-sched",
    "base/kor-virtio",
    "filesystems/kor-ext2",
    "filesystems/kor-fs",
    "filesystems/kor-ramfs",
    "apps/korhv",
    "apps/korix",
    "apps/koros",
]
