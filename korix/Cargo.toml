[package]
name = "korix"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "korix"
path = "src/main.rs"

[dependencies]
kor = { path = "../kor" }
kor-frame = { path = "../kor-frame" }
kor-alloc = { path = "../kor-alloc" }
kor-fs = { path = "../kor-fs" }
kor-ext2 = { path = "../kor-ext2" }
kor-ramfs = { path = "../kor-ramfs" }
kor-arch = { path = "../kor-arch" }
spin = "0.9"
buddy_system_allocator = "0.11"

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15"

[build-dependencies]
# build.rs generates linker script from linker.lds template
